version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      # Map to 6380 on host to avoid conflict with your local Redis
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./backend:/app/backend
    env_file:
      - ./backend/.env
    environment:
      # Override Redis URL to use Docker service name instead of localhost
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./backend:/app/backend
    env_file:
      - ./backend/.env
    environment:
      # Override Redis URL to use Docker service name instead of localhost
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A backend.jobs.tasks worker -P threads --loglevel=info --concurrency=2
    working_dir: /app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Tell Next.js where the backend lives inside Docker network
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    command: npm run dev -- --hostname 0.0.0.0
    depends_on:
      - backend

volumes:
  redis_data:
