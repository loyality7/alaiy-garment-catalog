services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - input_data:/app/input
      - output_data:/app/output
      - huggingface_cache:/home/appuser/.cache/huggingface
    depends_on:
      - redis

  celery_worker:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - input_data:/app/input
      - output_data:/app/output
      - huggingface_cache:/home/appuser/.cache/huggingface
    depends_on:
      - redis
    command: celery -A backend.jobs.tasks worker -P threads --loglevel=info --concurrency=1

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  redis_data:
  input_data:
  output_data:
  huggingface_cache:
